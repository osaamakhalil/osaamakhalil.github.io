baseURL = "https://osaamakhalil.github.io/"
languageCode = "en-us"
title = "Some Thoughts"
theme = "PaperMod"
paginate = 10

[params]
  env = "production"
  description = "A personal blog by Osama Khalil"
  author = "Osama Khalil"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowFullTextinRSS = true

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false
    responsiveImages = true

  [params.homeInfoParams]
    Title = "Some Thoughts"
    Content = """Stories, ideas, and reflections on technology, software, and life."""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/osaamakhalil"

[menu]
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archive/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
  [markup.goldmark.renderer]
    unsafe = true
